name: CD Manual

on:
  workflow_dispatch:
    inputs:
      service:
        description: 选择要部署的服务（镜像构建 + 推送）
        required: true
        type: choice
        options:
          - all
          - api-service
          - cron-service
          - owl-web
          - admin-web
          - cron-web

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - input: api-service
            dockerfile: apps/api-service/Dockerfile
          - input: cron-service
            dockerfile: apps/cron-service/Dockerfile
          - input: owl-web
            dockerfile: apps/owl-web/Dockerfile
          - input: admin-web
            dockerfile: apps/admin-web/Dockerfile
          - input: cron-web
            dockerfile: apps/cron-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.service == 'all' || matrix.input == github.event.inputs.service }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.input }}:${{ github.sha }}
