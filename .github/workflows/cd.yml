name: CD

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-release:
    name: Detect Release Type
    runs-on: self-hosted
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
      release_type: ${{ steps.detect.outputs.release_type }}
      backend_apps: ${{ steps.detect.outputs.backend_apps }}
      frontend_apps: ${{ steps.detect.outputs.frontend_apps }}
      app_versions: ${{ steps.detect.outputs.app_versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        run: |
          BACKEND=""
          FRONTEND=""
          BACKEND_VERSIONS=""
          FRONTEND_VERSIONS=""

          for app in api-service cron-service; do
            CURRENT=$(git show HEAD:apps/${app}/package.json 2>/dev/null | jq -r .version)
            PREVIOUS=$(git show HEAD~1:apps/${app}/package.json 2>/dev/null | jq -r .version || echo "0.0.0")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              if [ -z "$BACKEND" ]; then
                BACKEND="${app}"
                BACKEND_VERSIONS="${app}:${CURRENT}"
              else
                BACKEND="${BACKEND},${app}"
                BACKEND_VERSIONS="${BACKEND_VERSIONS} ${app}:${CURRENT}"
              fi
            fi
          done

          for app in portal admin-web owl-web cron-web mobile-web; do
            CURRENT=$(git show HEAD:apps/${app}/package.json 2>/dev/null | jq -r .version)
            PREVIOUS=$(git show HEAD~1:apps/${app}/package.json 2>/dev/null | jq -r .version || echo "0.0.0")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              if [ -z "$FRONTEND" ]; then
                FRONTEND="${app}"
                FRONTEND_VERSIONS="${app}:${CURRENT}"
              else
                FRONTEND="${FRONTEND},${app}"
                FRONTEND_VERSIONS="${FRONTEND_VERSIONS} ${app}:${CURRENT}"
              fi
            fi
          done

          ALL_VERSIONS="${BACKEND_VERSIONS} ${FRONTEND_VERSIONS}"

          if [ -z "$BACKEND" ] && [ -z "$FRONTEND" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "release_type=none" >> $GITHUB_OUTPUT
            echo "No version changes detected, skipping deployment."
          else
            CHANGED_APPS="${BACKEND}${FRONTEND:+,$FRONTEND}"
            if [ "$CHANGED_APPS" = "api-service,cron-service,portal,admin-web,owl-web,cron-web,mobile-web" ]; then
              RELEASE_TYPE="all"
            else
              RELEASE_TYPE="single"
            fi
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "release_type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
            echo "backend_apps=${BACKEND}" >> $GITHUB_OUTPUT
            echo "frontend_apps=${FRONTEND}" >> $GITHUB_OUTPUT
            echo "app_versions=${ALL_VERSIONS}" >> $GITHUB_OUTPUT
            echo "Release type: ${RELEASE_TYPE}"
            echo "Backend apps: ${BACKEND:-none}"
            echo "Frontend apps: ${FRONTEND:-none}"
            echo "Versions: ${ALL_VERSIONS}"
          fi

  verify:
    name: Verify and Lint
    runs-on: self-hosted
    needs: detect-release
    if: needs.detect-release.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @owl/database prisma:generate
      - run: pnpm -F @owl/shared build
      - run: pnpm verify:quick

  build-api-service:
    name: Build Backend (api-service)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.backend_apps, 'api-service')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/api-service/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/api-service:${{ steps.version.outputs.version }} \
            -t owl/api-service:latest \
            -f apps/api-service/Dockerfile .

  build-cron-service:
    name: Build Backend (cron-service)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.backend_apps, 'cron-service')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/cron-service/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/cron-service:${{ steps.version.outputs.version }} \
            -t owl/cron-service:latest \
            -f apps/cron-service/Dockerfile .

  build-admin-web:
    name: Build Frontend (admin-web)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.frontend_apps, 'admin-web')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/admin-web/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/admin-web:${{ steps.version.outputs.version }} \
            -t owl/admin-web:latest \
            -f apps/admin-web/Dockerfile .

  build-owl-web:
    name: Build Frontend (owl-web)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.frontend_apps, 'owl-web')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/owl-web/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/owl-web:${{ steps.version.outputs.version }} \
            -t owl/owl-web:latest \
            -f apps/owl-web/Dockerfile .

  build-cron-web:
    name: Build Frontend (cron-web)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.frontend_apps, 'cron-web')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/cron-web/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/cron-web:${{ steps.version.outputs.version }} \
            -t owl/cron-web:latest \
            -f apps/cron-web/Dockerfile .

  build-portal:
    name: Build Frontend (portal)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.frontend_apps, 'portal')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/portal/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/portal:${{ steps.version.outputs.version }} \
            -t owl/portal:latest \
            -f apps/portal/Dockerfile .

  build-mobile-web:
    name: Build Frontend (mobile-web)
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
    if: always() && needs.verify.result == 'success' && contains(needs.detect-release.outputs.frontend_apps, 'mobile-web')
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/mobile-web/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/mobile-web:${{ steps.version.outputs.version }} \
            -t owl/mobile-web:latest \
            -f apps/mobile-web/Dockerfile .

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    needs:
      - detect-release
      - verify
      - build-api-service
      - build-cron-service
      - build-portal
      - build-admin-web
      - build-owl-web
      - build-cron-web
      - build-mobile-web
    if: always() && needs.detect-release.outputs.should_deploy == 'true' && needs.detect-release.result == 'success' && (needs.build-api-service.result == 'success' || needs.build-api-service.result == 'skipped') && (needs.build-cron-service.result == 'success' || needs.build-cron-service.result == 'skipped') && (needs.build-portal.result == 'success' || needs.build-portal.result == 'skipped') && (needs.build-admin-web.result == 'success' || needs.build-admin-web.result == 'skipped') && (needs.build-owl-web.result == 'success' || needs.build-owl-web.result == 'skipped') && (needs.build-cron-web.result == 'success' || needs.build-cron-web.result == 'skipped') && (needs.build-mobile-web.result == 'success' || needs.build-mobile-web.result == 'skipped')
    outputs:
      deploy_results: ${{ steps.update-images.outputs.deploy_results }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure namespace and deployments
        run: |
          docker exec k3s kubectl get namespace owl >/dev/null 2>&1 || docker exec k3s kubectl create namespace owl
          if ! docker exec k3s kubectl get deployment api-service -n owl >/dev/null 2>&1; then
            echo "Deployments not found, applying manifests..."
            docker cp k8s/base k3s:/tmp/k8s-base
            docker exec k3s kubectl apply -k /tmp/k8s-base/
            docker exec k3s rm -rf /tmp/k8s-base
          fi
      - name: Clean docker build cache
        run: |
          echo "Pruning docker build cache..."
          docker builder prune -f
          echo "Cleaning stale owl images from k3s containerd (keeping current)..."
          CURRENT_IMAGES=""
          for entry in $APP_VERSIONS; do
            CURRENT_IMAGES="$CURRENT_IMAGES docker.io/owl/${entry%%:*}:${entry##*:}"
          done
          docker exec k3s ctr -n k8s.io images list -q 2>/dev/null | grep '^docker.io/owl/' | while read -r ref; do
            echo " $CURRENT_IMAGES " | grep -Fq " $ref " && continue
            docker exec k3s ctr -n k8s.io images rm "$ref" >/dev/null 2>&1 && echo "removed $ref"
          done
      - name: Update existing deployment images
        id: update-images
        env:
          APP_VERSIONS: ${{ needs.detect-release.outputs.app_versions }}
        run: |
          RESULTS=""
          FAILED=0
          for entry in $APP_VERSIONS; do
            app="${entry%%:*}"
            ver="${entry##*:}"
            echo "Deploying ${app} version ${ver}..."
            if docker save owl/${app}:${ver} | docker exec -i k3s ctr -n k8s.io images import - \
               && docker exec k3s kubectl set image deployment/${app} ${app}=owl/${app}:${ver} -n owl \
               && docker exec k3s kubectl rollout status deployment/${app} -n owl --timeout=300s; then
              RESULTS="${RESULTS} ${app}=success"
              echo "OK ${app}"
            else
              RESULTS="${RESULTS} ${app}=failed"
              FAILED=1
              echo "FAILED ${app}"
            fi
          done
          echo "deploy_results=${RESULTS}" >> $GITHUB_OUTPUT
          exit $FAILED
      - name: Verify deployment
        run: |
          docker exec k3s kubectl get pods -n owl
          docker exec k3s kubectl get services -n owl
      - name: Clean host docker images after deploy
        env:
          APP_VERSIONS: ${{ needs.detect-release.outputs.app_versions }}
        run: |
          echo "Removing versioned owl images from host docker (keeping latest)..."
          for entry in $APP_VERSIONS; do
            ref="owl/${entry%%:*}:${entry##*:}"
            docker rmi "$ref" >/dev/null 2>&1 && echo "removed $ref"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^owl/' | while read -r ref; do
            tag="${ref##*:}"
            [ "$tag" = "latest" ] && continue
            docker rmi "$ref" >/dev/null 2>&1 && echo "removed stale $ref"
          done

  notify:
    name: Feishu Notify
    runs-on: self-hosted
    needs:
      - deploy
      - detect-release
    if: always() && needs.detect-release.outputs.should_deploy == 'true'
    steps:
      - name: Send notification
        env:
          FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/d1555289-d3fa-4a54-995e-0dc088b7202c
          FEISHU_SECRET: Guh42RBEaDqLy38GIdmuxd
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          DEPLOY_RESULTS: ${{ needs.deploy.outputs.deploy_results }}
          RELEASE_TYPE: ${{ needs.detect-release.outputs.release_type }}
          VERSIONS: ${{ needs.detect-release.outputs.app_versions }}
          ACTOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          TIMESTAMP=$(date +%s)
          STRING_TO_SIGN=$(printf "%s\n%s" "${TIMESTAMP}" "${FEISHU_SECRET}")
          SIGN=$(printf "" | openssl dgst -sha256 -hmac "${STRING_TO_SIGN}" -binary | base64)

          TIME_NOW=$(date '+%Y-%m-%d %H:%M:%S')
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "$RELEASE_TYPE" = "all" ]; then
            TYPE_CN="全量发版"
          elif [ "$RELEASE_TYPE" = "single" ]; then
            TYPE_CN="单应用发版"
          else
            TYPE_CN="无版本变更"
          fi

          if [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE="发版成功"
            TEMPLATE="green"
          else
            TITLE="发版失败"
            TEMPLATE="red"
          fi

          SERVICES_LINES=""
          for entry in $VERSIONS; do
            app="${entry%%:*}"
            ver="${entry##*:}"
            mark="-"
            if echo "$DEPLOY_RESULTS" | grep -qw "${app}=success"; then
              mark="✅ 成功"
            elif echo "$DEPLOY_RESULTS" | grep -qw "${app}=failed"; then
              mark="❌ 失败"
            fi
            SERVICES_LINES="${SERVICES_LINES}\n- ${app} v${ver} ${mark}"
          done
          if [ -z "$SERVICES_LINES" ]; then
            SERVICES_LINES="\n- 无"
          fi

          CONTENT="**发版人**：${ACTOR}\n**发版时间**：${TIME_NOW}\n**发版类型**：${TYPE_CN}\n**Commit**：${SHORT_SHA}\n\n**发版服务**：${SERVICES_LINES}"

          curl -X POST "${FEISHU_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"timestamp\": \"${TIMESTAMP}\",
              \"sign\": \"${SIGN}\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"${TITLE}\"},
                  \"template\": \"${TEMPLATE}\"
                },
                \"elements\": [{
                  \"tag\": \"markdown\",
                  \"content\": \"${CONTENT}\"
                }]
              }
            }"

  release-summary:
    name: Release Summary
    runs-on: self-hosted
    needs:
      - detect-release
      - deploy
      - notify
    if: always()
    steps:
      - name: Write summary
        env:
          SHOULD_DEPLOY: ${{ needs.detect-release.outputs.should_deploy }}
          RELEASE_TYPE: ${{ needs.detect-release.outputs.release_type }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$SHOULD_DEPLOY" = "true" ]; then
            echo "🚀 发布已执行（$RELEASE_TYPE），部署结果：$DEPLOY_RESULT（详见飞书通知）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 版本未变化，跳过发布（本次 push 命中 package.json 但版本号未变，未创建任何构建）" >> "$GITHUB_STEP_SUMMARY"
          fi
