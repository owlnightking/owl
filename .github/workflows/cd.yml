name: CD

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: self-hosted
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      deploy_all: ${{ steps.check.outputs.deploy_all }}
      changed_apps: ${{ steps.check.outputs.changed_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "v0.0.0")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only $PREVIOUS $CURRENT 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          APPS=""
          for app in api-service cron-service admin-web owl-web cron-web; do
            if echo "$CHANGED" | grep -q "apps/$app/"; then
              if [ -z "$APPS" ]; then
                APPS="$app"
              else
                APPS="$APPS,$app"
              fi
            fi
          done

          if [ -z "$APPS" ] || echo "$CHANGED" | grep -q "packages/"; then
            echo "deploy_all=true" >> $GITHUB_OUTPUT
            echo "changed_apps=api-service,cron-service,admin-web,owl-web,cron-web" >> $GITHUB_OUTPUT
          else
            echo "deploy_all=false" >> $GITHUB_OUTPUT
            echo "changed_apps=$APPS" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint
    runs-on: self-hosted
    needs: check-version
    if: needs.check-version.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick

  build-backend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: contains(needs.check-version.outputs.changed_apps, matrix.app)
    strategy:
      matrix:
        app: [api-service, cron-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/${{ matrix.app }}:${{ github.sha }} -f apps/${{ matrix.app }}/Dockerfile .

  build-frontend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: contains(needs.check-version.outputs.changed_apps, matrix.app)
    strategy:
      matrix:
        app: [admin-web, owl-web, cron-web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/${{ matrix.app }}:${{ github.sha }} -f apps/${{ matrix.app }}/Dockerfile .

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    needs:
      - check-version
      - build-backend
      - build-frontend
    if: always() && needs.check-version.result == 'success' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          docker exec k3s cat /etc/rancher/k3s/k3s.yaml > $HOME/.kube/config
          sed -i 's/127.0.0.1/localhost/g' $HOME/.kube/config
      - name: Update and restart pods
        env:
          CHANGED_APPS: ${{ needs.check-version.outputs.changed_apps }}
        run: |
          for app in $(echo $CHANGED_APPS | tr ',' ' '); do
            echo "Deploying $app..."
            kubectl set image deployment/$app $app=owl/$app:${{ github.sha }} -n owl
            kubectl rollout status deployment/$app -n owl --timeout=300s
          done
      - name: Verify
        run: |
          kubectl get pods -n owl

  notify:
    name: Feishu Notify
    runs-on: self-hosted
    needs: deploy
    if: always()
    steps:
      - name: Send Notification
        env:
          FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/d1555289-d3fa-4a54-995e-0dc088b7202c
          FEISHU_SECRET: Guh42RBEaDqLy38GIdmuxd
        run: |
          STATUS=${{ needs.deploy.result }}
          TIMESTAMP=$(date +%s)
          STRING_TO_SIGN="${TIMESTAMP}\n${FEISHU_SECRET}"
          SIGN=$(printf "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "" -binary | base64)
          CHANGED="${{ needs.check-version.outputs.changed_apps }}"

          if [ "$STATUS" = "success" ]; then
            TITLE="Deploy Success"
            CONTENT="Apps: ${CHANGED}\nVersion: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TITLE="Deploy Failed"
            CONTENT="Apps: ${CHANGED}\nVersion: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')\nPlease check logs"
          fi

          curl -X POST "${FEISHU_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"timestamp\": \"${TIMESTAMP}\",
              \"sign\": \"${SIGN}\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"${TITLE}\"},
                  \"template\": \"$([ \"$STATUS\" = 'success' ] && echo 'green' || echo 'red')\"
                },
                \"elements\": [{
                  \"tag\": \"markdown\",
                  \"content\": \"${CONTENT}\"
                }]
              }
            }"
