name: CD

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: self-hosted
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      backend_apps: ${{ steps.check.outputs.backend_apps }}
      frontend_apps: ${{ steps.check.outputs.frontend_apps }}
      app_versions: ${{ steps.check.outputs.app_versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          BACKEND=""
          BACKEND_VERSIONS=""
          FRONTEND=""
          FRONTEND_VERSIONS=""

          for app in api-service cron-service; do
            CURRENT=$(git show HEAD:apps/${app}/package.json 2>/dev/null | jq -r .version)
            PREVIOUS=$(git show HEAD~1:apps/${app}/package.json 2>/dev/null | jq -r .version)
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              if [ -z "$BACKEND" ]; then
                BACKEND="\"${app}\""
                BACKEND_VERSIONS="${app}:${CURRENT}"
              else
                BACKEND="${BACKEND},\"${app}\""
                BACKEND_VERSIONS="${BACKEND_VERSIONS} ${app}:${CURRENT}"
              fi
            fi
          done

          for app in admin-web owl-web cron-web; do
            CURRENT=$(git show HEAD:apps/${app}/package.json 2>/dev/null | jq -r .version)
            PREVIOUS=$(git show HEAD~1:apps/${app}/package.json 2>/dev/null | jq -r .version)
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              if [ -z "$FRONTEND" ]; then
                FRONTEND="\"${app}\""
                FRONTEND_VERSIONS="${app}:${CURRENT}"
              else
                FRONTEND="${FRONTEND},\"${app}\""
                FRONTEND_VERSIONS="${FRONTEND_VERSIONS} ${app}:${CURRENT}"
              fi
            fi
          done

          ALL_VERSIONS="${BACKEND_VERSIONS} ${FRONTEND_VERSIONS}"

          if [ -z "$BACKEND" ] && [ -z "$FRONTEND" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "No version changes detected, skipping deployment."
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "backend_apps=[${BACKEND}]" >> $GITHUB_OUTPUT
            echo "frontend_apps=[${FRONTEND}]" >> $GITHUB_OUTPUT
            echo "app_versions=${ALL_VERSIONS}" >> $GITHUB_OUTPUT
            echo "Deploy backend: ${BACKEND:-none}"
            echo "Deploy frontend: ${FRONTEND:-none}"
            echo "Versions: ${ALL_VERSIONS}"
          fi

  lint:
    name: Lint
    runs-on: self-hosted
    needs: check-version
    if: needs.check-version.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick

  build-backend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: needs.check-version.outputs.backend_apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.check-version.outputs.backend_apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/${{ matrix.app }}:${{ steps.version.outputs.version }} \
            -t owl/${{ matrix.app }}:latest \
            -f apps/${{ matrix.app }}/Dockerfile .

  build-frontend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: needs.check-version.outputs.frontend_apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.check-version.outputs.frontend_apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/${{ matrix.app }}:${{ steps.version.outputs.version }} \
            -t owl/${{ matrix.app }}:latest \
            -f apps/${{ matrix.app }}/Dockerfile .

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    needs:
      - check-version
      - build-backend
      - build-frontend
    if: always() && needs.check-version.result == 'success' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Ensure namespace and deployments
        run: |
          docker exec k3s kubectl get namespace owl >/dev/null 2>&1 || docker exec k3s kubectl create namespace owl
          if ! docker exec k3s kubectl get deployment api-service -n owl >/dev/null 2>&1; then
            echo "Deployments not found, applying manifests..."
            docker cp k8s/base k3s:/tmp/k8s-base
            docker exec k3s kubectl apply -k /tmp/k8s-base/
            docker exec k3s rm -rf /tmp/k8s-base
          fi
      - name: Update images and rollout
        env:
          APP_VERSIONS: ${{ needs.check-version.outputs.app_versions }}
        run: |
          for entry in $APP_VERSIONS; do
            app="${entry%%:*}"
            ver="${entry##*:}"
            echo "Deploying ${app} version ${ver}..."
            docker exec k3s kubectl set image deployment/${app} ${app}=owl/${app}:${ver} -n owl
            docker exec k3s kubectl rollout status deployment/${app} -n owl --timeout=300s
          done
      - name: Verify deployment
        run: |
          docker exec k3s kubectl get pods -n owl
          docker exec k3s kubectl get services -n owl

  notify:
    name: Feishu Notify
    runs-on: self-hosted
    needs: deploy
    if: always()
    steps:
      - name: Send notification
        env:
          FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/d1555289-d3fa-4a54-995e-0dc088b7202c
          FEISHU_SECRET: Guh42RBEaDqLy38GIdmuxd
        run: |
          STATUS="${{ needs.deploy.result }}"
          VERSIONS="${{ needs.check-version.outputs.app_versions }}"
          TIMESTAMP=$(date +%s)
          STRING_TO_SIGN="${TIMESTAMP}\n${FEISHU_SECRET}"
          SIGN=$(printf "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "" -binary | base64)

          if [ "$STATUS" = "success" ]; then
            TITLE="Deploy Success"
            TEMPLATE="green"
            CONTENT="Versions: ${VERSIONS}\nCommit: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TITLE="Deploy Failed"
            TEMPLATE="red"
            CONTENT="Versions: ${VERSIONS}\nCommit: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')\nPlease check workflow logs"
          fi

          curl -X POST "${FEISHU_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"timestamp\": \"${TIMESTAMP}\",
              \"sign\": \"${SIGN}\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"${TITLE}\"},
                  \"template\": \"${TEMPLATE}\"
                },
                \"elements\": [{
                  \"tag\": \"markdown\",
                  \"content\": \"${CONTENT}\"
                }]
              }
            }"
