name: CD

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: self-hosted
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      changed_apps: ${{ steps.check.outputs.changed_apps }}
      app_versions: ${{ steps.check.outputs.app_versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          APPS="api-service cron-service admin-web owl-web cron-web"
          CHANGED=""
          VERSIONS=""

          for app in $APPS; do
            CURRENT=$(git show HEAD:apps/${app}/package.json 2>/dev/null | jq -r .version)
            PREVIOUS=$(git show HEAD~1:apps/${app}/package.json 2>/dev/null | jq -r .version)
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              if [ -z "$CHANGED" ]; then
                CHANGED="$app"
                VERSIONS="${app}:${CURRENT}"
              else
                CHANGED="$CHANGED,$app"
                VERSIONS="${VERSIONS} ${app}:${CURRENT}"
              fi
            fi
          done

          if [ -z "$CHANGED" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "No version changes detected, skipping deployment."
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "changed_apps=$CHANGED" >> $GITHUB_OUTPUT
            echo "app_versions=$VERSIONS" >> $GITHUB_OUTPUT
            echo "Deploy apps: $CHANGED"
            echo "Versions: $VERSIONS"
          fi

  lint:
    name: Lint
    runs-on: self-hosted
    needs: check-version
    if: needs.check-version.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick

  build-backend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: contains(needs.check-version.outputs.changed_apps, matrix.app)
    strategy:
      matrix:
        app: [api-service, cron-service]
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/${{ matrix.app }}:${{ steps.version.outputs.version }} \
            -t owl/${{ matrix.app }}:latest \
            -f apps/${{ matrix.app }}/Dockerfile .

  build-frontend:
    name: Build ${{ matrix.app }}
    runs-on: self-hosted
    needs: lint
    if: contains(needs.check-version.outputs.changed_apps, matrix.app)
    strategy:
      matrix:
        app: [admin-web, owl-web, cron-web]
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VER=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            -t owl/${{ matrix.app }}:${{ steps.version.outputs.version }} \
            -t owl/${{ matrix.app }}:latest \
            -f apps/${{ matrix.app }}/Dockerfile .

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    needs:
      - check-version
      - build-backend
      - build-frontend
    if: always() && needs.check-version.result == 'success' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          docker exec k3s cat /etc/rancher/k3s/k3s.yaml > $HOME/.kube/config
          sed -i 's/127.0.0.1/localhost/g' $HOME/.kube/config
      - name: Ensure namespace exists
        run: |
          kubectl get namespace owl >/dev/null 2>&1 || kubectl create namespace owl
      - name: Apply manifests if needed
        run: |
          # Check if deployments exist, apply if not
          for app in api-service cron-service admin-web owl-web cron-web; do
            if ! kubectl get deployment $app -n owl >/dev/null 2>&1; then
              echo "Deployment $app not found, applying manifests..."
              kubectl apply -k k8s/base/
              break
            fi
          done
      - name: Update images and rollout
        env:
          CHANGED_APPS: ${{ needs.check-version.outputs.changed_apps }}
          APP_VERSIONS: ${{ needs.check-version.outputs.app_versions }}
        run: |
          for entry in $APP_VERSIONS; do
            app="${entry%%:*}"
            ver="${entry##*:}"
            echo "Deploying ${app} version ${ver}..."
            kubectl set image deployment/${app} ${app}=owl/${app}:${ver} -n owl
            kubectl rollout status deployment/${app} -n owl --timeout=300s
          done
      - name: Verify deployment
        run: |
          kubectl get pods -n owl
          kubectl get services -n owl

  notify:
    name: Feishu Notify
    runs-on: self-hosted
    needs: deploy
    if: always()
    steps:
      - name: Send notification
        env:
          FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/d1555289-d3fa-4a54-995e-0dc088b7202c
          FEISHU_SECRET: Guh42RBEaDqLy38GIdmuxd
        run: |
          STATUS="${{ needs.deploy.result }}"
          CHANGED="${{ needs.check-version.outputs.changed_apps }}"
          VERSIONS="${{ needs.check-version.outputs.app_versions }}"
          TIMESTAMP=$(date +%s)
          STRING_TO_SIGN="${TIMESTAMP}\n${FEISHU_SECRET}"
          SIGN=$(printf "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "" -binary | base64)

          if [ "$STATUS" = "success" ]; then
            TITLE="Deploy Success"
            TEMPLATE="green"
            CONTENT="Apps: ${CHANGED}\nVersions: ${VERSIONS}\nCommit: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TITLE="Deploy Failed"
            TEMPLATE="red"
            CONTENT="Apps: ${CHANGED}\nVersions: ${VERSIONS}\nCommit: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')\nPlease check workflow logs"
          fi

          curl -X POST "${FEISHU_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"timestamp\": \"${TIMESTAMP}\",
              \"sign\": \"${SIGN}\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"${TITLE}\"},
                  \"template\": \"${TEMPLATE}\"
                },
                \"elements\": [{
                  \"tag\": \"markdown\",
                  \"content\": \"${CONTENT}\"
                }]
              }
            }"
