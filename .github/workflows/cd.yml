name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: self-hosted
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "v0.0.0")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint
    runs-on: self-hosted
    needs: check-version
    if: needs.check-version.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick

  build-api-service:
    name: Build API Service
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/api-service:${{ github.sha }} -f apps/api-service/Dockerfile .

  build-cron-service:
    name: Build Cron Service
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/cron-service:${{ github.sha }} -f apps/cron-service/Dockerfile .

  build-admin-web:
    name: Build Admin Web
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/admin-web:${{ github.sha }} -f apps/admin-web/Dockerfile .

  build-owl-web:
    name: Build Owl Web
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/owl-web:${{ github.sha }} -f apps/owl-web/Dockerfile .

  build-cron-web:
    name: Build Cron Web
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t owl/cron-web:${{ github.sha }} -f apps/cron-web/Dockerfile .

  deploy:
    name: Deploy to K3s
    runs-on: self-hosted
    needs:
      - build-api-service
      - build-cron-service
      - build-admin-web
      - build-owl-web
      - build-cron-web
    steps:
      - uses: actions/checkout@v4
      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          docker exec k3s cat /etc/rancher/k3s/k3s.yaml > $HOME/.kube/config
          sed -i 's/127.0.0.1/localhost/g' $HOME/.kube/config
      - name: Update image tags
        run: |
          cd k8s/base
          for app in api-service admin-web owl-web cron-web cron-service; do
            sed -i "s|image:.*|image: owl/${app}:${{ github.sha }}|g" ${app}.yaml
          done
      - name: Deploy
        run: |
          kubectl apply -k k8s/base/
          kubectl rollout status deployment/api-service -n owl --timeout=300s
          kubectl rollout status deployment/admin-web -n owl --timeout=300s
          kubectl rollout status deployment/owl-web -n owl --timeout=300s
          kubectl rollout status deployment/cron-web -n owl --timeout=300s
          kubectl rollout status deployment/cron-service -n owl --timeout=300s
      - name: Verify
        run: |
          kubectl get pods -n owl
          kubectl get services -n owl

  notify:
    name: Feishu Notify
    runs-on: self-hosted
    needs: deploy
    if: always()
    steps:
      - name: Send Notification
        env:
          FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/d1555289-d3fa-4a54-995e-0dc088b7202c
          FEISHU_SECRET: Guh42RBEaDqLy38GIdmuxd
        run: |
          STATUS=${{ needs.deploy.result }}
          TIMESTAMP=$(date +%s)
          STRING_TO_SIGN="${TIMESTAMP}\n${FEISHU_SECRET}"
          SIGN=$(printf "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "" -binary | base64)

          if [ "$STATUS" = "success" ]; then
            TITLE="Deploy Success"
            CONTENT="Version: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')"
          else
            TITLE="Deploy Failed"
            CONTENT="Version: ${{ github.sha }}\nTime: $(date '+%Y-%m-%d %H:%M:%S')\nPlease check logs"
          fi

          curl -X POST "${FEISHU_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"timestamp\": \"${TIMESTAMP}\",
              \"sign\": \"${SIGN}\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"${TITLE}\"},
                  \"template\": \"$([ \"$STATUS\" = 'success' ] && echo 'green' || echo 'red')\"
                },
                \"elements\": [{
                  \"tag\": \"markdown\",
                  \"content\": \"${CONTENT}\"
                }]
              }
            }"
