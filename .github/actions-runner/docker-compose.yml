services:
  github-runner:
    build: .
    image: owl/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ORG_NAME: owlnightking
      REPO_NAME: owl
      RUNNER_NAME: docker-runner
      RUNNER_LABELS: self-hosted,linux,x64,docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/runner/_work
      - runner-config:/runner/.runner

volumes:
  runner-work:
  runner-config:
