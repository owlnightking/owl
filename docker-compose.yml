# Owl 应用 Docker 编排
# 中间件（PostgreSQL / Redis / RabbitMQ / MinIO）复用本机已运行的 Docker 容器，
# 本项目不自行启动中间件。连接信息见 .env.example。
services:
  api-service:
    build:
      context: .
      dockerfile: apps/api-service/Dockerfile
    container_name: owl-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://admin:123456@host.docker.internal:5432/owl
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "123456"
      RABBITMQ_URL: amqp://admin:123456@host.docker.internal:5672
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: minio123456
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: owl-portal
    ports:
      - "5270:5270"
    depends_on:
      api-service:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: owl-admin
    ports:
      - "5274:5274"
    depends_on:
      api-service:
        condition: service_healthy

  owl-web:
    build:
      context: .
      dockerfile: apps/owl-web/Dockerfile
    container_name: owl-web
    ports:
      - "5273:5273"
    depends_on:
      api-service:
        condition: service_healthy

  cron-web:
    build:
      context: .
      dockerfile: apps/cron-web/Dockerfile
    container_name: owl-cron-web
    ports:
      - "5275:5275"
    depends_on:
      api-service:
        condition: service_healthy

  mobile-web:
    build:
      context: .
      dockerfile: apps/mobile-web/Dockerfile
    container_name: owl-mobile
    ports:
      - "5276:5276"
    depends_on:
      api-service:
        condition: service_healthy
